# Builds the PathSense Android app and publishes the .apk as a (pre-)release, so it can be downloaded on a phone.
name: Android app
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PathSense.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PathSense-apk
          path: PathSense.apk
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" PathSense.apk --prerelease \
            --target "${{ github.sha }}" --title "PathSense Android app (build ${{ github.run_number }})" \
            --notes "Install on Android: open this page on the phone, download PathSense.apk, allow installs from the browser when asked. Start the site on the laptop with start_pathsense.bat, then type the address it shows into the app."
